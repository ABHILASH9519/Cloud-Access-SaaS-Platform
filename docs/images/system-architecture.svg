<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<defs><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:14px}.sub{font-size:13px;fill:#59677d}.box{fill:#f7f9fc;stroke:#899bb3;stroke-width:2}.blue{fill:#e8f2ff;stroke:#4385cf;stroke-width:2}.green{fill:#e8f7ef;stroke:#32956a;stroke-width:2}.purple{fill:#f2ebff;stroke:#8c6ac8;stroke-width:2}.line{stroke:#65758b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65758b"/></marker></defs>
<rect width="1100" height="520" rx="18" fill="#fff"/><text x="550" y="45" text-anchor="middle" class="title">Cloud Access SaaS Platform — Current API Architecture</text>
<rect x="55" y="130" width="190" height="95" rx="12" class="blue"/><text x="150" y="163" text-anchor="middle" class="head">Client</text><text x="150" y="190" text-anchor="middle" class="body">HTTP JSON requests</text>
<rect x="320" y="115" width="230" height="125" rx="12" class="purple"/><text x="435" y="148" text-anchor="middle" class="head">Express API</text><text x="435" y="176" text-anchor="middle" class="body">CORS + JSON middleware</text><text x="435" y="199" text-anchor="middle" class="body">GET / and /api/auth/*</text>
<rect x="625" y="115" width="205" height="125" rx="12" class="box"/><text x="727" y="148" text-anchor="middle" class="head">Auth Controller</text><text x="727" y="176" text-anchor="middle" class="body">Register / Login</text><text x="727" y="199" text-anchor="middle" class="body">bcrypt + JWT</text>
<rect x="900" y="130" width="155" height="95" rx="12" class="green"/><text x="977" y="163" text-anchor="middle" class="head">PostgreSQL</text><text x="977" y="190" text-anchor="middle" class="body">User records</text>
<path d="M245 177 H315 M550 177 H620 M830 177 H895" class="line"/>
<rect x="325" y="325" width="225" height="95" rx="12" class="blue"/><text x="437" y="357" text-anchor="middle" class="head">Prisma ORM</text><text x="437" y="384" text-anchor="middle" class="body">User model / DB access</text>
<rect x="625" y="325" width="205" height="95" rx="12" class="purple"/><text x="727" y="357" text-anchor="middle" class="head">JWT Secret</text><text x="727" y="384" text-anchor="middle" class="body">Environment variable</text>
<path d="M727 240 V285 H437 V320" class="line"/><path d="M727 240 V320" class="line"/>
<text x="550" y="465" text-anchor="middle" class="sub">Diagram reflects the checked-in Express, auth routes, controller and Prisma User schema.</text><text x="550" y="486" text-anchor="middle" class="sub">Cloud-provider access provisioning, authorization policies and deployment infrastructure are not shown as implemented.</text>
</svg>