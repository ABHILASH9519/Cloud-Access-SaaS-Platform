<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390">
<defs><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.head{font-size:16px;font-weight:700}.body{font-size:13px}.blue{fill:#e8f2ff;stroke:#4385cf;stroke-width:2}.green{fill:#e8f7ef;stroke:#32956a;stroke-width:2}.purple{fill:#f2ebff;stroke:#8c6ac8;stroke-width:2}.box{fill:#f7f9fc;stroke:#899bb3;stroke-width:2}.line{stroke:#65758b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65758b"/></marker></defs>
<rect width="1100" height="390" rx="18" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">Authentication Request Workflow</text>
<rect x="30" y="105" width="155" height="92" rx="10" class="blue"/><text x="107" y="137" text-anchor="middle" class="head">1. Client</text><text x="107" y="163" text-anchor="middle" class="body">Register / Login</text>
<rect x="225" y="105" width="165" height="92" rx="10" class="purple"/><text x="307" y="137" text-anchor="middle" class="head">2. Express Route</text><text x="307" y="163" text-anchor="middle" class="body">/api/auth/*</text>
<rect x="430" y="105" width="175" height="92" rx="10" class="box"/><text x="517" y="137" text-anchor="middle" class="head">3. Controller</text><text x="517" y="163" text-anchor="middle" class="body">Validate / process</text>
<rect x="645" y="105" width="175" height="92" rx="10" class="blue"/><text x="732" y="137" text-anchor="middle" class="head">4. Password</text><text x="732" y="163" text-anchor="middle" class="body">bcrypt hash/compare</text>
<rect x="860" y="105" width="205" height="92" rx="10" class="green"/><text x="962" y="137" text-anchor="middle" class="head">5. Prisma + PostgreSQL</text><text x="962" y="163" text-anchor="middle" class="body">Create / find user</text>
<path d="M185 151 H220 M390 151 H425 M605 151 H640 M820 151 H855" class="line"/>
<rect x="330" y="260" width="200" height="75" rx="10" class="purple"/><text x="430" y="289" text-anchor="middle" class="head">Successful login</text><text x="430" y="313" text-anchor="middle" class="body">JWT expires in 7 days</text>
<rect x="620" y="260" width="200" height="75" rx="10" class="box"/><text x="720" y="289" text-anchor="middle" class="head">API response</text><text x="720" y="313" text-anchor="middle" class="body">Token or error status</text>
<path d="M962 197 V230 H430 V255 M530 297 H615" class="line"/>
</svg>